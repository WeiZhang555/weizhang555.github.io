# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: WeiZhang555/myblog
  branch: master
  # Sveltia CMS Authenticator deployed on Cloudflare Workers
  base_url: https://sveltia-cms-auth.zhangwei-cs.workers.dev
  # domain checked against the worker's ALLOWED_DOMAINS
  site_domain: weizhang555.github.io
  # minimal scope: myblog is a public repository
  auth_scope: public_repo

# CMS 保存后直接提交到 master，自动触发 GitHub Actions 构建并发布

media_folder: static/images
public_folder: /images

collections:
  - name: original
    label: 原创
    label_singular: 原创文章
    folder: content/original
    create: true
    identifier_field: path_id
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: 文件标识, name: path_id, widget: string, pattern: ['^[a-z0-9][-a-z0-9.]*[a-z0-9]$', "请用小写字母、数字和连字符，如 my-first-post"], hint: "英文短标识，用于文件名和分支名（不影响文章URL）" }
      - { label: 标题, name: title, widget: string }
      - { label: 发布日期, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss ZZ", time_format: false }
      - { label: 标签, name: tags, widget: list, required: false, hint: "如：容器、K8S" }
      - { label: 分类, name: categories, widget: list, required: false }
      - { label: 显示目录, name: toc, widget: boolean, default: true }
      - { label: 草稿, name: draft, widget: boolean, default: false, hint: "草稿不会发布到网站" }
      - { label: 正文, name: body, widget: markdown }

  - name: translate
    label: 译文
    label_singular: 译文文章
    folder: content/translate
    create: true
    identifier_field: path_id
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: 文件标识, name: path_id, widget: string, pattern: ['^[a-z0-9][-a-z0-9.]*[a-z0-9]$', "请用小写字母、数字和连字符，如 my-first-post"], hint: "英文短标识，用于文件名和分支名（不影响文章URL）" }
      - { label: 标题, name: title, widget: string }
      - { label: 发布日期, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss ZZ", time_format: false }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 分类, name: categories, widget: list, required: false }
      - { label: 显示目录, name: toc, widget: boolean, default: true }
      - { label: 草稿, name: draft, widget: boolean, default: false }
      - { label: 正文, name: body, widget: markdown }

  - name: republish
    label: 转载
    label_singular: 转载文章
    folder: content/republish
    create: true
    identifier_field: path_id
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: 文件标识, name: path_id, widget: string, pattern: ['^[a-z0-9][-a-z0-9.]*[a-z0-9]$', "请用小写字母、数字和连字符，如 my-first-post"], hint: "英文短标识，用于文件名和分支名（不影响文章URL）" }
      - { label: 标题, name: title, widget: string }
      - { label: 发布日期, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss ZZ", time_format: false }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 分类, name: categories, widget: list, required: false }
      - { label: 显示目录, name: toc, widget: boolean, default: true }
      - { label: 草稿, name: draft, widget: boolean, default: false }
      - { label: 正文, name: body, widget: markdown }

  - name: about
    label: 关于页
    files:
      - name: about
        label: 关于我
        file: content/about/index.md
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 发布日期, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss ZZ", time_format: false }
          - { label: 草稿, name: draft, widget: boolean, default: false }
          - { label: 正文, name: body, widget: markdown }
